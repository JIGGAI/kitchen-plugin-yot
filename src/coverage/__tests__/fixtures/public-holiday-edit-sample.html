<!-- Trimmed /Staff/PublicHolidays/Edit/{id} page for the July 5 "Independance
     Day weekend" holiday (id 17020). The "Public holiday locations" multiselect
     scopes which locations the holiday CLOSES: selected = closed, unselected =
     open. Here the FL shops (Middleburg, Treaty Oaks, World of Golf, Yulee) are
     left open while the rest are closed. Mirrors the real markup: some options
     use selected="selected", the open ones have no selected attribute. -->
<div class="menu-location"><div id="change-location" class="ChangeLocation change-location"></div></div>
<div id="Locations_Container" class="size1 ">
  <label for="Locations">Public holiday locations</label>
  <select id="Locations_Locations" multiple="multiple" name="Locations.Locations">
    <option value="2780">** OFFICE **</option>
    <option selected="selected" value="2107">Auburn Hills MI</option>
    <option selected="selected" value="8276">Clearwater Fl</option>
    <option selected="selected" value="7810">Daytona FL</option>
    <option selected="selected" value="2651">Jacksonville FL</option>
    <option selected="selected" value="1349">Livonia MI</option>
    <option value="8192">Middleburg Fl</option>
    <option value="7429">Treaty Oaks St. Aug. Fl.</option>
    <option value="6787">World of Golf FL.</option>
    <option value="7728">Yulee Fl</option>
    <option value="4086">TEST LOCATION</option>
  </select>
</div>
